# =====================================================
# SecondBrain - Docker Compose
# =====================================================
# Servicios:
#   - postgres    : DB relacional con pgvector
#   - qdrant      : Vector DB
#   - ollama      : LLMs locales (con GPU NVIDIA)
#   - whisper     : Transcripción de audio
#   - backend     : FastAPI Python
#   - frontend    : Streamlit panel admin
#   - bridge      : Bridge WhatsApp en vivo (Baileys) — Sprint 2
#   - ollama-init : One-shot que descarga modelos al inicio
#
# El Vault (archivos crudos: audios, imágenes, docs) NO es un servicio propio
# -- es un directorio en disco (./data/vault) montado directo en backend, que
# lo sirve vía /api/vault/file (ver app/services/vault_storage.py). Antes era
# un container MinIO/S3 aparte; para un vault de un solo usuario era más
# infraestructura de la que hacía falta.
# =====================================================

services:

  # ---------------------------------------------------
  # PostgreSQL 16 con pgvector
  # ---------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Qdrant - Vector Database
  # ---------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: "no"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY requerido}
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Ollama - LLMs locales con GPU CUDA
  # ---------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Ollama bootstrap - descarga modelos al primer arranque
  # ---------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL_PRIMARY: ${OLLAMA_MODEL_PRIMARY:-qwen3:8b}
      OLLAMA_MODEL_VISION: ${OLLAMA_MODEL_VISION:-qwen3-vl:8b}
      OLLAMA_MODEL_EMBEDDING: ${OLLAMA_MODEL_EMBEDDING:-bge-m3}
    entrypoint: >
      /bin/sh -c "
      echo 'Descargando modelos Ollama (puede tardar 20-30 min en primera ejecución)...';
      ollama pull $$OLLAMA_MODEL_PRIMARY;
      ollama pull $$OLLAMA_MODEL_VISION;
      ollama pull $$OLLAMA_MODEL_EMBEDDING;
      echo 'Modelos descargados correctamente';
      ollama list;
      "
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Whisper - Transcripción de audio
  # ---------------------------------------------------
  whisper:
    # CPU-only: liberamos los ~4.3 GB de VRAM que ocupaba large-v3-turbo en GPU.
    # La transcripción es nocturna/async y los audios de WhatsApp son cortos:
    # con faster_whisper int8 en CPU multinúcleo el rendimiento es aceptable.
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: "no"
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      ASR_ENGINE: faster_whisper
      ASR_LANG: ${WHISPER_LANG:-es}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "9002:9000"  # internamente sigue siendo :9000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/docs', timeout=2)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Backend - FastAPI Python
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # Postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Vault (filesystem, ver volumes más abajo)
      VAULT_PATH: /vault
      VAULT_PUBLIC_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      # Ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL_PRIMARY: ${OLLAMA_MODEL_PRIMARY:-qwen3:8b}
      OLLAMA_MODEL_VISION: ${OLLAMA_MODEL_VISION:-qwen3-vl:8b}
      OLLAMA_MODEL_EMBEDDING: ${OLLAMA_MODEL_EMBEDDING:-bge-m3}
      # Whisper
      WHISPER_URL: http://whisper:9000
      # App
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY requerido}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv  # preserva el venv entre reinicios
      - ./data/vault:/vault  # Vault: archivos crudos (antes vivía en MinIO)
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s  # tiempo para que uv instale deps en primer arranque
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Frontend - Streamlit panel admin
  # ---------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      BRIDGE_URL: http://bridge:3001
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./frontend:/app
      - frontend-venv:/app/.venv  # preserva el venv entre reinicios
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    networks:
      - secondbrain-net

  # ---------------------------------------------------
  # Bridge WhatsApp en vivo (Baileys)
  # ---------------------------------------------------
  bridge:
    build:
      context: ./bridge
      dockerfile: ../docker/bridge/Dockerfile
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BRIDGE_PORT: 3001
      BACKEND_URL: http://backend:8000
      BRIDGE_SESSION_PATH: /app/session
      BRIDGE_LOG_LEVEL: ${BRIDGE_LOG_LEVEL:-warn}
      BRIDGE_PAIR_NUMBER: ${BRIDGE_PAIR_NUMBER:-}
      BRIDGE_CAPTURE_OUTGOING: ${BRIDGE_CAPTURE_OUTGOING:-true}
      BRIDGE_INCLUDE_BROADCASTS: ${BRIDGE_INCLUDE_BROADCASTS:-false}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./data/whatsapp-session:/app/session  # sesión de WhatsApp persistida (Baileys multi-file auth)
    ports:
      - "${BRIDGE_PORT:-3001}:3001"
    networks:
      - secondbrain-net

# =====================================================
# Networks
# =====================================================
networks:
  secondbrain-net:
    driver: bridge

# =====================================================
# Volumes nombrados
# =====================================================
volumes:
  backend-venv:
  frontend-venv:
